<!doctype html>
<html lang="es-PE" data-type="service">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#142b49">
    <meta name="page-type" content="service">
    <meta name="site-kind" content="other">
    <meta name="description" content="SUNQU Consultoría Integral brinda orientación profesional en modalidad virtual.">
    <title>{% block title %}SUNQU — Consultoría Integral{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#contenido">Saltar al contenido</a>

    <header class="site-header">
      <div class="wrap header-inner">
        <a class="brand" href="{{ url_for('public.inicio') }}#inicio" aria-label="SUNQU, ir al inicio">
          <span class="brand-name">SUNQU</span>
          <span class="brand-description">Consultoría integral</span>
        </a>

        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
          <span class="menu-toggle-label">Menú</span>
          <span class="menu-toggle-mark" aria-hidden="true"></span>
        </button>

        <nav class="site-nav" id="site-nav" aria-label="Navegación principal">
          <a href="{{ url_for('public.inicio') }}#nosotros">Nosotros</a>
          <a href="{{ url_for('public.inicio') }}#servicios">Servicios</a>
          <a href="{{ url_for('public.inicio') }}#equipo">Equipo</a>
          <a href="{{ url_for('public.inicio') }}#proceso">Proceso</a>
          <a class="button button-small button-outline" href="{{ url_for('admin.login') }}">Iniciar sesión</a>
          <a class="button button-small" href="{{ url_for('public.inicio') }}#cita">Solicitar una cita</a>
        </nav>
      </div>
    </header>

    <main id="contenido">
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer" id="cierre">
      <div class="wrap footer-main">
        <div>
          <a class="footer-brand" href="{{ url_for('public.inicio') }}#inicio">SUNQU</a>
          <p>Orientación profesional en modalidad virtual.</p>
        </div>
        <a class="button button-small button-light" href="{{ url_for('admin.dashboard') }}">Acceso administrativo</a>
        <a class="footer-top" href="{{ url_for('public.inicio') }}#inicio">Volver al inicio <span aria-hidden="true">↑</span></a>
      </div>
    </footer>
  </body>
</html>
